# Open a PR to bump CLAWHUB_REF to a new reviewed SHA.
#
# Per **R § P1-17** the clawhub CLI install pins to a SHA. Bumps must
# go through a PR so a maintainer reviews the diff between the previous
# and new SHAs before publishes inherit the new code.
#
# Usage:
#   1. Repo maintainer triggers `workflow_dispatch` with the new SHA.
#   2. Workflow validates the SHA is 40-char hex AND that the SHA exists
#      in `openclaw/clawhub` (so a typo doesn't slip through).
#   3. Workflow opens a PR titled "chore: bump CLAWHUB_REF to <sha7>".
#   4. Maintainer reviews the upstream diff between the previous and
#      new SHA, then merges.
#
# Triggering on a clawhub release (e.g. via repository_dispatch from a
# webhook) is left as a follow-up — the manual workflow_dispatch path
# already covers the security goal (SHA + review-before-publish).
#
# All third-party actions pinned to full SHA per .claude/rules/infra-rules.md.

name: klodi clawhub-ref bump

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "New 40-char hex SHA on openclaw/clawhub. Must exist on that repo."
        required: true
        type: string
      reason:
        description: "Why bumping (e.g. 'pick up CLI v2.3 features X/Y')"
        required: true
        type: string

permissions: {}

concurrency:
  group: klodi-clawhub-bump
  cancel-in-progress: false

jobs:
  open-pr:
    name: Open SHA-bump PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    env:
      NEW_SHA: ${{ inputs.sha }}
      REASON: ${{ inputs.reason }}
    steps:
      - name: Validate SHA shape
        run: |
          if ! echo "$NEW_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::SHA must be 40-char hex; got '${NEW_SHA}'."
            exit 1
          fi

      - name: Validate SHA exists on openclaw/clawhub
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://api.github.com/repos/openclaw/clawhub/commits/${NEW_SHA}")
          if [[ "$status" != "200" ]]; then
            echo "::error::SHA ${NEW_SHA} not found on openclaw/clawhub (HTTP $status)."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true

      - name: Apply bump to klodi-plugin-release.yml
        run: |
          # The line we update is the env block with `CLAWHUB_REF: "<sha-or-placeholder>"`.
          # Capture the previous value first so the PR body can link to a
          # GitHub compare URL the reviewer can click straight into —
          # otherwise the maintainer has to dig out the prior SHA themselves.
          # Use perl rather than sed for portable in-place quote handling.
          PREV_SHA=$(grep -E '^\s*CLAWHUB_REF:' .github/workflows/klodi-plugin-release.yml \
            | sed -E 's/.*CLAWHUB_REF:\s*"([^"]*)".*/\1/' \
            | head -n1)
          if [ -z "$PREV_SHA" ]; then
            PREV_SHA="(none)"
          fi
          echo "PREV_SHA=$PREV_SHA" >> "$GITHUB_ENV"
          perl -i -pe 's/^(\s*CLAWHUB_REF:\s*)"[^"]*"/$1"$ENV{NEW_SHA}"/' \
            .github/workflows/klodi-plugin-release.yml
          if ! grep -q "CLAWHUB_REF: \"${NEW_SHA}\"" .github/workflows/klodi-plugin-release.yml; then
            echo "::error::failed to apply bump — pattern miss in klodi-plugin-release.yml"
            exit 1
          fi

      - name: Commit + open PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short="${NEW_SHA:0:7}"
          branch="chore/bump-clawhub-ref-${short}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add .github/workflows/klodi-plugin-release.yml
          git commit -m "chore: bump CLAWHUB_REF to ${short}"
          git push -u origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore: bump CLAWHUB_REF to ${short}" \
            --body "$(cat <<EOF
Automated SHA-bump for the clawhub CLI install pin in
\`klodi-plugin-release.yml\`. Per **R § P1-17** the publish step
runs \`npm install -g git+https://...#\${CLAWHUB_REF}\` with
\`id-token:write\` + \`contents:write\` — mutable refs would inherit
those permissions on a force-push or repo takeover.

**New SHA:** \`${NEW_SHA}\`
**Previous SHA:** \`${PREV_SHA}\`
**Reason:** ${REASON}
**Diff:** https://github.com/openclaw/clawhub/compare/${PREV_SHA}...${NEW_SHA}
EOF
)"
