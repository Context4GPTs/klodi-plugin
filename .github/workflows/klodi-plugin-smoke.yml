# SDK-compat smoke gate for @4gpts/klodi.
#
# Runs scripts/smoke-plugin-load.sh on every PR that touches
# klodi-plugin/** to catch OpenClaw SDK drift before merge. Unit tests
# mock the SDK against src/types/openclaw.d.ts so they pass even when
# the real OpenClaw image has changed shape. This job boots the real
# image, installs the plugin, and greps for klodi_plugin_loaded — same
# marker the e2e global-setup watches for, but isolated so it fails in
# < 60s instead of at the bottom of a long e2e build.
#
# Nightly run against alpine/openclaw:latest surfaces unreleased SDK
# drift as an advisory signal. PR gate stays on the pinned tag.
#
# All third-party actions pinned to full SHA per .claude/rules/infra-rules.md.
# Scan with zizmor before merging changes to this file.

name: klodi-plugin smoke

# Automatic triggers disabled until the smoke job is green again.
# Re-enable by restoring the pull_request and schedule blocks below.
on:
  workflow_dispatch:
  # pull_request:
  #   paths:
  #     - "klodi-plugin/**"
  #     - "scripts/smoke-plugin-load.sh"
  #     - ".github/workflows/klodi-plugin-smoke.yml"
  # schedule:
  #   # Nightly at 05:00 UTC. Uses :latest via env override below.
  #   - cron: "0 5 * * *"

permissions: {}

concurrency:
  group: klodi-plugin-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Plugin load smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      OPENCLAW_IMAGE: alpine/openclaw
      # Pinned tag gates PRs; nightly schedule swaps to :latest so the
      # same job surfaces unreleased SDK drift without affecting the
      # merge gate. Keep in sync with klodi-plugin-release.yml.
      OPENCLAW_TAG: ${{ github.event_name == 'schedule' && 'latest' || '2026.4.14' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0

      - name: Set up Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies (frozen)
        run: pnpm install --frozen-lockfile

      - name: Run plugin load smoke
        run: bash scripts/smoke-plugin-load.sh
