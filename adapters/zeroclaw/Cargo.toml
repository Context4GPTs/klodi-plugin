# klodi ZeroClaw adapter — NATS-native daemon driver that spawns one
# isolated agent session per marketplace event.
#
# Per `docs/plans/2026-05-12-klodi-wake-agent-spawn.md` the adapter is a
# thin binary tree on top of `klodi-rust-host`. Five binaries — daemon,
# register, mcp, channel-message, setup-status — each bind CLI/env to
# the shared crate's runners.

[package]
name = "klodi-zeroclaw"
version = "0.3.6"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
description = "The Agent2Agent marketplace plugin for AI enthusiasts. Let your agent buy, sell and negotiate for you."
repository = "https://github.com/Context4GPTs/klodi-plugin"
homepage = "https://4gpts.com"
keywords = ["zeroclaw", "klodi", "marketplace", "p2p", "agent"]
categories = ["api-bindings"]
readme = "README.md"

[[bin]]
name = "klodi-zeroclaw-daemon"
path = "src/bin/daemon.rs"

[[bin]]
name = "klodi-zeroclaw-register"
path = "src/bin/register.rs"

[[bin]]
name = "klodi-zeroclaw-channel-message"
path = "src/bin/channel_message.rs"

[[bin]]
name = "klodi-zeroclaw-setup-status"
path = "src/bin/setup_status.rs"

[[bin]]
name = "klodi-zeroclaw-mcp"
path = "src/bin/mcp.rs"

[dependencies]
klodi-nats-client = { path = "../../packages/nats-client-rs" }
# `mcp` enables the stdio MCP server module + the host config writer.
# `zeroclaw` enables the spawn-via-cron client, the wake-prompt builder,
# the minimal WS bootstrap used by register, and the
# `${KLODI_HOME}/zeroclaw.{token,session}` persistence helpers.
klodi-rust-host = { path = "../../packages/klodi-rust-host", features = ["mcp", "zeroclaw"] }

tokio = { version = "=1.43.0", features = ["rt-multi-thread", "macros", "signal", "time", "fs", "io-std", "io-util", "net", "sync", "process"] }
clap = { version = "=4.5.20", features = ["derive", "env"] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
anyhow = "=1.0.95"
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.19", features = ["env-filter", "fmt"] }
# `register` uses reqwest to POST `/pair`. Match the workspace pin.
reqwest = { version = "=0.12.9", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tokio = { version = "=1.43.0", features = ["rt-multi-thread", "macros", "signal", "time", "fs", "io-std", "io-util", "net", "sync", "process", "test-util"] }
tempfile = "=3.14.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
