# klodi Moltis adapter — NATS-native daemon driver.
#
# Per **D § D8** the adapter is a thin binary tree on top of
# `klodi-rust-host`. Three binaries (daemon, register, channel-message)
# each bind CLI/env to the shared crate's runners.
#
# What used to live here as `forwarder.rs` / `register.rs` /
# `default_paths.rs` (~600 LOC) now lives in `klodi-rust-host` once;
# this crate only carries the per-adapter knobs (URL, env-var name,
# bearer-token / no-bearer-token, log prefix).

[package]
name = "klodi-moltis"
version = "0.2.2"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
description = "klodi — Moltis adapter. NATS-native wake daemon."
repository = "https://github.com/Context4GPTs/klodi-plugin"
homepage = "https://4gpts.com"
keywords = ["moltis", "klodi", "marketplace", "p2p", "agent"]
categories = ["api-bindings"]
readme = "README.md"

[[bin]]
name = "klodi-moltis-daemon"
path = "src/bin/daemon.rs"

[[bin]]
name = "klodi-moltis-register"
path = "src/bin/register.rs"

[[bin]]
name = "klodi-moltis-channel-message"
path = "src/bin/channel_message.rs"

[[bin]]
name = "klodi-moltis-setup-status"
path = "src/bin/setup_status.rs"

[[bin]]
name = "klodi-moltis-mcp"
path = "src/bin/mcp.rs"

[dependencies]
klodi-nats-client = { path = "../../packages/nats-client-rs" }
# `mcp` enables the stdio MCP server module + the host config writer.
klodi-rust-host = { path = "../../packages/klodi-rust-host", features = ["mcp"] }

# Async runtime — match the workspace pin.
tokio = { version = "=1.43.0", features = ["rt-multi-thread", "macros", "signal", "time", "fs", "io-std", "io-util", "net", "sync"] }

# CLI parsing.
clap = { version = "=4.5.20", features = ["derive", "env"] }

serde_json = "=1.0.140"

anyhow = "=1.0.95"

tracing-subscriber = { version = "=0.3.19", features = ["env-filter", "fmt"] }

[profile.release]
# Lean binaries: Moltis caches plugins locally; tight artifacts speed
# installs and reduce disk pressure for users running many plugins.
opt-level = "z"
lto = true
codegen-units = 1
strip = true
