# klodi IronClaw adapter — NATS-native daemon driver.
#
# Per **D § D8** the adapter is a thin binary tree on top of
# `klodi-rust-host`. Three binaries (daemon, register, channel-message)
# each bind CLI/env to the shared crate's runners. The previous
# per-adapter `forwarder.rs` / `register.rs` / `default_paths.rs`
# duplication is gone.

[package]
name = "klodi-ironclaw"
version = "0.2.2"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
description = "klodi — IronClaw adapter. NATS-native wake daemon."
repository = "https://github.com/Context4GPTs/klodi-plugin"
homepage = "https://4gpts.com"
keywords = ["ironclaw", "klodi", "marketplace", "p2p", "agent"]
categories = ["api-bindings"]
readme = "README.md"

[[bin]]
name = "klodi-ironclaw-daemon"
path = "src/bin/daemon.rs"

[[bin]]
name = "klodi-ironclaw-register"
path = "src/bin/register.rs"

[[bin]]
name = "klodi-ironclaw-channel-message"
path = "src/bin/channel_message.rs"

[[bin]]
name = "klodi-ironclaw-setup-status"
path = "src/bin/setup_status.rs"

[[bin]]
name = "klodi-ironclaw-mcp"
path = "src/bin/mcp.rs"

[dependencies]
klodi-nats-client = { path = "../../packages/nats-client-rs" }
# `mcp` enables the stdio MCP server module + the host config writer.
klodi-rust-host = { path = "../../packages/klodi-rust-host", features = ["mcp"] }

tokio = { version = "=1.43.0", features = ["rt-multi-thread", "macros", "signal", "time", "fs", "io-std", "io-util", "net", "sync"] }
clap = { version = "=4.5.20", features = ["derive", "env"] }
serde_json = "=1.0.140"
anyhow = "=1.0.95"
tracing-subscriber = { version = "=0.3.19", features = ["env-filter", "fmt"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
