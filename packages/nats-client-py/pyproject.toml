# klodi-nats-client — Python port of @klodi/nats-client (TS).
#
# Strict mirror of the TypeScript surface; the TS client at
# klodi-plugin/packages/nats-client-ts/ is the canonical wire contract.

[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "klodi-nats-client"
version = "0.1.0"
description = "Klodi NATS-WS client for Python host adapters: tool calls, durable wake consumers, channel publish."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "4GPTs", email = "hello@4gpts.com" }]
keywords = ["klodi", "nats", "jetstream", "marketplace", "p2p", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    # Internal-only. Each adapter (klodi-hermes, klodi-nanobot) vendors
    # this package's source into its own wheel at publish time (see
    # adapters/<host>/scripts/vendor.py) so consumers install one
    # self-contained wheel per host. The "Private :: Do Not Upload"
    # classifier is the canonical PyPI tripwire — twine/PyPI reject any
    # upload that carries it, so this can never escape to PyPI.
    "Private :: Do Not Upload",
]
dependencies = [
    "nats-py==2.14.0",
    "websockets==15.0",
    # `nats-py` imports `nkeys` lazily inside `credsAuthenticator`. Without
    # this declaration, runtime fails with `No module named 'nkeys'` the
    # first time the client opens a creds-authenticated connection.
    "nkeys==0.2.0",
    # `nkeys` 0.2.0 imports `nacl.signing` but does not declare PyNaCl as a
    # transitive dependency (upstream packaging bug). Without this entry,
    # any creds-authenticated connection fails with `No module named 'nacl'`.
    "pynacl==1.6.2",
]

[project.optional-dependencies]
test = [
    "pytest==8.3.4",
    "pytest-asyncio==1.0.0",
]

[project.urls]
Homepage = "https://4gpts.com"
Repository = "https://github.com/Context4GPTs/klodi-plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
klodi_nats_client = ["py.typed", "schemas.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
