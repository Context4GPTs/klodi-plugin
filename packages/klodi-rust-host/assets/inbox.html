<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>klodi · inbox</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231a1a1a'/%3E%3Ctext x='50%25' y='56%25' font-family='ui-monospace,monospace' font-size='40' font-weight='700' fill='%23fafafa' text-anchor='middle'%3Ek%3C/text%3E%3C/svg%3E">
  <style>
    :root { color-scheme: light dark; --fg: #1a1a1a; --bg: #fafafa; --card: #fff; --border: #ddd; --muted: #888; --accent: #0a8050; --warn: #c44; --code-bg: #f3f3f3; }
    @media (prefers-color-scheme: dark) { :root { --fg: #eee; --bg: #1a1a1a; --card: #2a2a2a; --border: #3a3a3a; --code-bg: #111; } }
    * { box-sizing: border-box; }
    body { font: 15px/1.5 system-ui, -apple-system, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; color: var(--fg); background: var(--bg); }
    header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 1.5rem; padding-bottom: 0.75rem; border-bottom: 1px solid var(--border); }
    h1 { font-size: 1.125rem; margin: 0; font-weight: 600; }
    .status-line { font-size: 0.8125rem; color: var(--muted); }
    .status-line.error { color: var(--warn); }
    .actions-bar { display: flex; gap: 0.75rem; align-items: center; }
    .actions-bar button { font-size: 0.8125rem; padding: 0.375rem 0.75rem; border: 1px solid var(--border); border-radius: 6px; background: transparent; color: var(--fg); cursor: pointer; }
    .actions-bar button:hover { border-color: var(--fg); }
    .actions-bar button[hidden] { display: none; }
    .empty { padding: 2.5rem 1rem; text-align: center; color: var(--muted); font-size: 0.9375rem; border: 1px dashed var(--border); border-radius: 10px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 1rem 1.25rem; margin-bottom: 1rem; }
    .card.new { animation: fadeIn 0.4s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
    .card-head { display: flex; justify-content: space-between; gap: 1rem; align-items: baseline; margin-bottom: 0.5rem; }
    .req-tag { font: 600 0.75rem/1 ui-monospace, "SF Mono", Menlo, monospace; color: var(--muted); background: var(--code-bg); padding: 0.25rem 0.5rem; border-radius: 4px; letter-spacing: 0.04em; }
    .timestamp { font-size: 0.75rem; color: var(--muted); }
    .summary { font-size: 1rem; font-weight: 600; margin: 0 0 0.5rem; white-space: pre-wrap; word-break: break-word; }
    .details { font-size: 0.875rem; color: var(--fg); opacity: 0.8; margin: 0 0 0.75rem; white-space: pre-wrap; word-break: break-word; }
    textarea { width: 100%; min-height: 4em; padding: 0.5rem 0.625rem; font-family: inherit; font-size: 0.9375rem; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--fg); resize: vertical; }
    textarea:focus { outline: 2px solid var(--fg); outline-offset: -2px; }
    .reply-row { display: flex; justify-content: flex-end; align-items: center; gap: 0.75rem; margin-top: 0.5rem; }
    .send-status { font-size: 0.8125rem; color: var(--muted); flex: 1; }
    .send-status.err { color: var(--warn); }
    button.send { padding: 0.4375rem 1rem; font-size: 0.875rem; border: 1px solid var(--fg); border-radius: 6px; background: var(--fg); color: var(--bg); cursor: pointer; font-weight: 500; }
    button.send:hover:not(:disabled) { opacity: 0.92; }
    button.send:disabled { opacity: 0.5; cursor: not-allowed; }
    a { color: inherit; }
  </style>
</head>
<body>
  <header>
    <h1>klodi · inbox</h1>
    <div class="actions-bar">
      <span id="status" class="status-line">connecting…</span>
      <button type="button" id="notify-btn" hidden>Enable notifications</button>
    </div>
  </header>
  <main id="root"></main>
  <script>
    'use strict';
    const POLL_MS = 1500;
    const root = document.getElementById('root');
    const statusEl = document.getElementById('status');
    const notifyBtn = document.getElementById('notify-btn');
    let seenIds = new Set();
    // `notifiedIds` tracks every req_id we've ever fired a Web
    // Notification for. Without this, a tab-reopen would re-notify
    // every still-open escalation on the cold render (the seenIds set
    // is empty at startup, so every escalation looks "new"). Once a
    // req_id closes (operator replies) we drop it from the set so a
    // future re-escalation with the same id would notify again — but
    // in practice req_ids are fresh per escalation so this is a
    // belt-and-braces detail.
    const notifiedIds = new Set();
    let pollTimer = null;
    let inFlight = false;

    function escapeHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function fmtRelative(iso) {
      if (!iso) return '';
      const t = Date.parse(iso);
      if (Number.isNaN(t)) return iso;
      const delta = Math.max(0, (Date.now() - t) / 1000);
      if (delta < 45) return 'just now';
      if (delta < 90) return '1 min ago';
      const mins = Math.round(delta / 60);
      if (mins < 60) return mins + ' min ago';
      const hrs = Math.round(mins / 60);
      if (hrs < 24) return hrs + 'h ago';
      const days = Math.round(hrs / 24);
      return days + 'd ago';
    }

    function renderEmpty() {
      root.innerHTML = '<div class="empty">No open escalations. Klodi is autonomous.</div>';
    }

    function renderCards(escalations) {
      const fresh = new Set();
      const html = escalations.map((e) => {
        fresh.add(e.req_id);
        const isNew = !seenIds.has(e.req_id);
        const details = e.details
          ? '<p class="details">' + escapeHtml(e.details) + '</p>'
          : '';
        return (
          '<article class="card' + (isNew ? ' new' : '') + '" data-req="' + escapeHtml(e.req_id) + '">' +
            '<div class="card-head">' +
              '<span class="req-tag">req=' + escapeHtml(e.req_id) + '</span>' +
              '<span class="timestamp" data-iso="' + escapeHtml(e.posted_at || '') + '">' +
                escapeHtml(fmtRelative(e.posted_at)) +
              '</span>' +
            '</div>' +
            '<p class="summary">' + escapeHtml(e.summary) + '</p>' +
            details +
            '<textarea aria-label="Reply" placeholder="Type your reply…"></textarea>' +
            '<div class="reply-row">' +
              '<span class="send-status"></span>' +
              '<button type="button" class="send">Send</button>' +
            '</div>' +
          '</article>'
        );
      }).join('');
      root.innerHTML = html;
      seenIds = fresh;
    }

    function reconcile(escalations) {
      const fresh = new Set(escalations.map((e) => e.req_id));
      const newly = escalations.filter((e) => !seenIds.has(e.req_id));
      const removed = [...seenIds].filter((id) => !fresh.has(id));
      // Anything closed? Drop the card and update the seen set.
      removed.forEach((id) => {
        const card = root.querySelector('article[data-req="' + cssEscape(id) + '"]');
        if (card) card.remove();
        seenIds.delete(id);
        // Allow a future re-issue of the same req_id to re-notify the
        // operator if it ever happens (req_ids are freshly minted per
        // escalation, so in practice this branch rarely matters — but
        // it keeps `notifiedIds` from growing unbounded).
        notifiedIds.delete(id);
      });
      // Anything new? Render new cards.
      newly.forEach((e) => {
        const card = buildCard(e, true);
        root.insertBefore(card, root.firstChild);
        seenIds.add(e.req_id);
        maybePushNotification(e);
      });
      // Refresh timestamps on existing cards.
      escalations.forEach((e) => {
        const card = root.querySelector('article[data-req="' + cssEscape(e.req_id) + '"]');
        if (!card) return;
        const ts = card.querySelector('.timestamp');
        if (ts) ts.textContent = fmtRelative(e.posted_at);
      });
      if (root.childElementCount === 0) {
        renderEmpty();
      }
      updateTitle();
    }

    function cssEscape(s) {
      // Per-request ids are short hex; no escaping needed in practice,
      // but be defensive against CSS metacharacters anyway.
      return String(s).replace(/(["\\\]\[#.])/g, '\\$1');
    }

    function buildCard(e, isNew) {
      const el = document.createElement('article');
      el.className = 'card' + (isNew ? ' new' : '');
      el.dataset.req = e.req_id;
      const details = e.details
        ? '<p class="details">' + escapeHtml(e.details) + '</p>'
        : '';
      el.innerHTML =
        '<div class="card-head">' +
          '<span class="req-tag">req=' + escapeHtml(e.req_id) + '</span>' +
          '<span class="timestamp">' + escapeHtml(fmtRelative(e.posted_at)) + '</span>' +
        '</div>' +
        '<p class="summary">' + escapeHtml(e.summary) + '</p>' +
        details +
        '<textarea aria-label="Reply" placeholder="Type your reply…"></textarea>' +
        '<div class="reply-row">' +
          '<span class="send-status"></span>' +
          '<button type="button" class="send">Send</button>' +
        '</div>';
      return el;
    }

    function updateTitle() {
      const n = root.querySelectorAll('article.card').length;
      document.title = n > 0 ? '(' + n + ') Klodi inbox' : 'Klodi inbox';
    }

    function maybePushNotification(e) {
      if (typeof Notification === 'undefined') return;
      if (Notification.permission !== 'granted') return;
      if (notifiedIds.has(e.req_id)) return;
      notifiedIds.add(e.req_id);
      try {
        new Notification('Klodi: ' + e.summary, {
          body: e.details ? e.details.slice(0, 200) : '',
          tag: 'klodi-' + e.req_id,
        });
      } catch (_) { /* no-op */ }
    }

    async function poll() {
      if (inFlight) return;
      inFlight = true;
      try {
        const res = await fetch('/inbox/api/escalations', { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const body = await res.json();
        statusEl.textContent = 'connected · last poll ' +
          new Date(body.polled_at || Date.now()).toLocaleTimeString();
        statusEl.classList.remove('error');
        const escalations = Array.isArray(body.escalations) ? body.escalations : [];
        if (root.childElementCount === 0 && escalations.length === 0) {
          renderEmpty();
          updateTitle();
        } else if (root.childElementCount === 0) {
          renderCards(escalations);
          updateTitle();
          escalations.forEach(maybePushNotification);
        } else if (root.querySelector('.empty') && escalations.length > 0) {
          root.innerHTML = '';
          renderCards(escalations);
          updateTitle();
          escalations.forEach(maybePushNotification);
        } else {
          reconcile(escalations);
        }
      } catch (err) {
        statusEl.textContent = 'disconnected — ' + (err && err.message ? err.message : 'unknown error');
        statusEl.classList.add('error');
      } finally {
        inFlight = false;
      }
    }

    async function sendReply(card) {
      const reqId = card.dataset.req;
      const textarea = card.querySelector('textarea');
      const button = card.querySelector('button.send');
      const status = card.querySelector('.send-status');
      const content = (textarea.value || '').trim();
      if (!content) {
        status.textContent = 'Reply cannot be empty.';
        status.classList.add('err');
        textarea.focus();
        return;
      }
      status.textContent = 'sending…';
      status.classList.remove('err');
      button.disabled = true;
      textarea.disabled = true;
      try {
        const res = await fetch('/inbox/api/reply', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ req_id: reqId, content: content }),
        });
        const json = await res.json().catch(() => ({}));
        if (!res.ok || json.ok === false) {
          const reason = json && json.error ? json.error : 'HTTP ' + res.status;
          throw new Error(reason);
        }
        status.textContent = 'sent — awaiting agent';
        // Don't manually remove the card; the next poll tick will drop
        // it when the gateway's message list confirms the reply was
        // observed.
      } catch (err) {
        status.textContent = 'failed: ' + (err && err.message ? err.message : 'unknown') + ' · click Send to retry';
        status.classList.add('err');
        button.disabled = false;
        textarea.disabled = false;
      }
    }

    root.addEventListener('click', (ev) => {
      const button = ev.target.closest('button.send');
      if (!button) return;
      const card = button.closest('article.card');
      if (card) sendReply(card);
    });

    root.addEventListener('keydown', (ev) => {
      // ⌘/Ctrl + Enter inside a textarea sends.
      if ((ev.metaKey || ev.ctrlKey) && ev.key === 'Enter' && ev.target.matches('textarea')) {
        ev.preventDefault();
        const card = ev.target.closest('article.card');
        if (card) sendReply(card);
      }
    });

    function refreshNotifyButton() {
      if (typeof Notification === 'undefined') {
        notifyBtn.hidden = true;
        return;
      }
      if (Notification.permission === 'default') {
        notifyBtn.hidden = false;
        notifyBtn.textContent = 'Enable notifications';
      } else {
        notifyBtn.hidden = true;
      }
    }

    notifyBtn.addEventListener('click', () => {
      if (typeof Notification === 'undefined') return;
      Notification.requestPermission().then(refreshNotifyButton);
    });

    refreshNotifyButton();
    renderEmpty();
    poll();
    pollTimer = setInterval(poll, POLL_MS);
    window.addEventListener('beforeunload', () => {
      if (pollTimer) clearInterval(pollTimer);
    });
  </script>
</body>
</html>
