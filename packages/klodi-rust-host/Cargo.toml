# klodi-rust-host — host-orchestration glue for the Rust adapters.
#
# `klodi-nats-client` is the wire-level NATS client (connect, request,
# subscribe, publish). This crate sits one layer up: the wake forwarder
# (subscribes both consumers, calls a per-adapter callback per event),
# HTTP-only registration loop, default `${KLODI_HOME}` paths,
# `klodi_setup_status` reporter, and the `--health-port` HTTP probe.
#
# Three adapters (klodi-moltis, klodi-ironclaw, klodi-zeroclaw) consume
# this crate. Their bin/ files are thin drivers that build a
# `ForwarderConfig` from CLI/env and call into here.
#
# Per **D § D8** in
# `docs/reviews/2026-04-26-klodi-plugin-multi-lens-review-decisions.md`
# this is option (b): a separate crate so `klodi-nats-client` stays
# usable in non-daemon contexts.

[package]
name = "klodi-rust-host"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
description = "klodi — host-orchestration glue for Rust adapters (forwarder, register, paths, setup_status, health probe)."
repository = "https://github.com/Context4GPTs/klodi-plugin"
homepage = "https://4gpts.com"
keywords = ["klodi", "marketplace", "p2p", "agent", "daemon"]
categories = ["api-bindings", "asynchronous"]
readme = "README.md"
# Internal-only crate. Each adapter (klodi-moltis, klodi-ironclaw,
# klodi-zeroclaw) vendors this crate's source into its own tree at
# publish time the same way it vendors `nats-client-rs`. `publish = false`
# makes `cargo publish` fail loud if anyone tries to push this to crates.io.
publish = false

[lib]
name = "klodi_rust_host"
path = "src/lib.rs"

[features]
default = []
# Enables the stdio MCP server (`mcp` module) plus the helpers that wire
# klodi into a host's MCP config (`host_mcp_config` module). Adapters
# whose host acts as an MCP client pull this in; daemon-only adapters
# keep the lean dependency tree.
mcp = ["dep:rmcp", "dep:toml_edit"]
# Enables the ZeroClaw-specific path: wake-prompt builder, spawn-via-cron
# client (`zeroclaw_spawn`), minimal WS client for register-time session
# bootstrap, `${KLODI_HOME}/zeroclaw.{token,session}` persistence helpers,
# and the gateway-CLI pairing-code minter. Only the ZeroClaw adapter
# enables this — Moltis/IronClaw stay on the structured-wake HTTP path.
zeroclaw = ["dep:tokio-tungstenite", "dep:http"]

[dependencies]
klodi-nats-client = { path = "../nats-client-rs" }
klodi-logger = { path = "../logger-rs" }

# Async runtime — match the workspace pin.
# `process` is needed by the ZeroClaw browser-pairing minter
# (`zeroclaw_browser_pairing`) which shells out to
# `zeroclaw gateway get-paircode --new`.
tokio = { version = "=1.43.0", features = ["rt-multi-thread", "macros", "signal", "time", "fs", "io-std", "io-util", "net", "sync", "process"] }

# Outbound HTTP for the host wake POST and the registration HTTP poll.
# `rustls-tls` keeps OpenSSL out of the build for portability.
reqwest = { version = "=0.12.9", default-features = false, features = ["json", "rustls-tls"] }

serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"

anyhow = "=1.0.95"
thiserror = "=2.0.18"

# Used by the registration flow to mint the session UUID.
uuid = { version = "=1.18.0", features = ["v4"] }

tracing = "=0.1.41"

# Used by the forwarder + register subscribe / await semantics.
futures-util = "=0.3.31"

rmcp = { version = "=1.6.0", features = ["server", "transport-io", "macros"], optional = true }
toml_edit = { version = "=0.22.22", optional = true }

# `zeroclaw` feature only — see [features].
# `tokio-tungstenite` is the WebSocket client used by `register` to
# bootstrap the operator chat session with a single hello line via
# `/ws/chat`. `rustls-tls-native-roots` matches the `rustls-tls` posture
# of reqwest so the release binary stays OpenSSL-free. `http` is needed
# to construct the WS upgrade request with `Authorization: Bearer …`.
tokio-tungstenite = { version = "=0.24.0", default-features = false, features = ["connect", "rustls-tls-native-roots"], optional = true }
# `http` 1.x — match whatever reqwest's resolver picks (currently 1.4.x).
http = { version = "1", optional = true }

[dev-dependencies]
tokio = { version = "=1.43.0", features = ["rt-multi-thread", "macros", "signal", "time", "fs", "io-std", "io-util", "net", "sync", "test-util", "process"] }
tempfile = "=3.14.0"
wiremock = "=0.6.2"
